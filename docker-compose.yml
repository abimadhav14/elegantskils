services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elegant_silks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elegant_silks"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_URL: jdbc:postgresql://db:5432/elegant_silks
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
volumes:
  postgres_data:
